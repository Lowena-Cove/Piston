[package]
name = "android-bindings"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
futures = { workspace = true }

# Android NDK bindings
ndk = { workspace = true }
ndk-sys = { workspace = true }
jni = { workspace = true }

# Error handling
thiserror = "1.0"

# Logging for Android
android_logger = "0.13"

# Compositor core
compositor-core = { path = "../compositor-core" }
wayland-server = { path = "../wayland-server" }

# SteamOS emulator core
steamos-emulator = { path = ".." }

# Additional dependencies
once_cell = "1.19"
parking_lot = "0.12"

[lib]
crate-type = ["cdylib"]
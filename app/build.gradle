apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.piston"
        minSdkVersion 21  // Lowered for older device support
        targetSdkVersion 34
        versionCode 2
        versionName "1.1-legacy"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c11 -DLEGACY_SUPPORT=1"
                // Add flags for older CPU compatibility
                arguments "-DANDROID_ARM_MODE=arm", 
                          "-DANDROID_ARM_NEON=FALSE",
                          "-DCMAKE_ANDROID_ARCH_ABI=armeabi-v7a"
            }
        }
        ndk {
            // Extended architecture support including older variants
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64', 'mips', 'mips64'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
        // Add legacy build type for older systems
        legacy {
            initWith debug
            minifyEnabled false
            debuggable false
            externalNativeBuild {
                cmake {
                    cppFlags "-std=c11 -DLEGACY_SUPPORT=1 -O2 -fno-strict-aliasing"
                    arguments "-DANDROID_ARM_MODE=arm"
                }
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'
}

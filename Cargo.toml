[package]
name = "steamos-emulator"
version = "0.1.0"
edition = "2021"
authors = ["Piston Team"]
description = "A Rust-based Linux emulator for running SteamOS environments"
license = "MIT"
repository = "https://github.com/piston/steamos-emulator"

[dependencies]
# Core emulation dependencies
byteorder = "1.4"
memmap2 = "0.9"
libc = "0.2"
nix = "0.27"

# Async runtime for handling multiple processes
tokio = { version = "1.0", features = ["full"] }

# Command line interface
clap = { version = "4.0", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization for configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# File system operations
walkdir = "2.3"

# Compression for handling disk images
flate2 = "1.0"
tar = "0.4"

# Network emulation (optional)
socket2 = "0.5"

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "steamos-emu"
path = "src/main.rs"

[lib]
name = "steamos_emulator"
path = "src/lib.rs"

[features]
default = ["x86_64", "filesystem", "networking"]
x86_64 = []
filesystem = []
networking = []
debug = []
[workspace]
members = [
    "compositor-core",
    "wayland-server", 
    "android-bindings",
    "graphics-pipeline"
]

[workspace.dependencies]
# Common dependencies for all crates
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"

# Graphics and windowing
winit = "0.29"
wgpu = "0.18"
raw-window-handle = "0.5"

# Wayland protocol support
wayland-server = "0.31"
wayland-protocols = "0.31"

# Android NDK bindings
ndk = "0.8"
ndk-sys = "0.5"
jni = "0.21"

# Async and concurrency
futures = "0.3"
async-trait = "0.1"

# Serialization and IPC
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Memory management
shared_memory = "0.12"
memmap2 = "0.9"
